<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify Product - Furn Organics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 35px 0;
      display: flex;
      justify-content: center;
      color: #111;
    }

    .container {
      width: 760px;
      background: #eeeeee;
      padding: 22px;
      border: 1px solid #d0d0d0;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .nav-buttons a {
      text-decoration: none;
    }

    .nav-buttons button,
    button {
      padding: 7px 13px;
      cursor: pointer;
      background: #ffffff;
      color: #111;
      border: 1px solid #999;
      font: inherit;
    }

    .nav-buttons button {
      font-weight: bold;
    }

    .nav-buttons button:hover,
    button:hover {
      background: #e6e6e6;
    }

    .box {
      background: white;
      border: 1px solid #ccc;
      padding: 18px;
      margin-top: 15px;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #999;
      background: white;
      font-size: 14px;
    }

    input:focus {
      outline: 2px solid #cfcfcf;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #ccc;
      background: white;
      font-weight: bold;
    }

    .authentic {
      background: #e0ffe0;
      border-color: #66aa66;
      color: #145c14;
    }

    .invalid {
      background: #ffe0e0;
      border-color: #cc7777;
      color: #8a1111;
    }

    .footer {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }

    @media (max-width: 800px) {
      body {
        padding: 0;
      }

      .container {
        width: 100%;
        min-height: 100vh;
      }

      .nav-buttons {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="nav-buttons">
    <a href="index.html"><button type="button">Shop</button></a>
    <a href="about.html"><button type="button">About</button></a>
    <a href="info.html"><button type="button">Info</button></a>
  </div>

  <div class="box">
    <h1>Verify Product</h1>
    <p>Enter your verification code below to check if the product is authentic.</p>

    <input id="codeInput" placeholder="Enter verification code">
    <button type="button" onclick="verifyCode()">Verify</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <p class="footer">Powered by Furn</p>

</div>

<script>
let VALID_CODES = [];

async function loadCodes() {
  try {
    const response = await fetch("valid-codes.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Could not load valid-codes.json");
    }

    const data = await response.json();
    VALID_CODES = data.codes || [];

  } catch (err) {
    console.error(err);

    const result = document.getElementById("result");
    result.style.display = "block";
    result.className = "result invalid";
    result.textContent = "Verification system is unavailable right now.";
  }
}

function verifyCode() {
  const input = document.getElementById("codeInput").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if (!input) {
    result.style.display = "block";
    result.className = "result invalid";
    result.textContent = "Please enter a code.";
    return;
  }

  const match = VALID_CODES.find(item => item.code.toUpperCase() === input);

  if (match) {
    result.style.display = "block";
    result.className = "result authentic";
    result.innerHTML = `
      Authentic<br><br>
      Product: ${match.product}<br>
      Message: ${match.message}
    `;
  } else {
    result.style.display = "block";
    result.className = "result invalid";
    result.textContent = "Invalid code. This code was not found.";
  }
}

loadCodes();
</script>

</body>
</html>
