<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Furn Organics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 35px 0;
      display: flex;
      justify-content: center;
      color: #111;
    }

    .container {
      width: 760px;
      background: #eeeeee;
      padding: 22px;
      border: 1px solid #d0d0d0;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .nav-buttons a {
      text-decoration: none;
    }

    .nav-buttons button,
    button {
      padding: 7px 13px;
      cursor: pointer;
      background: #ffffff;
      color: #111;
      border: 1px solid #999;
      font: inherit;
    }

    .nav-buttons button {
      font-weight: bold;
    }

    .nav-buttons button:hover,
    button:hover {
      background: #e6e6e6;
    }

    .header {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: stretch;
    }

    .header img {
      width: 205px;
      height: 205px;
      object-fit: cover;
      background: #000;
      border: 1px solid #ccc;
    }

    textarea {
      width: 100%;
      resize: none;
      padding: 10px;
      border: 1px solid #999;
      font-family: Arial, sans-serif;
      background: white;
      font-size: 14px;
    }

    hr {
      border: none;
      border-top: 1px solid #aaa;
      margin: 22px 0;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #999;
      background: white;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #cfcfcf;
    }

    .product {
      background: white;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .product-info {
      line-height: 1.4;
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
    }

    .product-price {
      margin-top: 4px;
    }

    .cart-box,
    .checkout-box {
      background: white;
      border: 1px solid #ccc;
      padding: 14px;
      margin-bottom: 12px;
    }

    .cart-item {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-total {
      font-size: 16px;
      margin-top: 10px;
    }

    #status {
      font-weight: bold;
      margin-top: 12px;
    }

    .order-box {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
    }

    .shipping-message {
      background: #fff7d6;
      border: 1px solid #d6be5c;
      padding: 10px;
      margin-bottom: 10px;
    }

    .payment-message {
      background: #e7f0ff;
      border: 1px solid #7799cc;
      padding: 10px;
      margin-bottom: 10px;
    }

    .disabled-shipping {
      background: #ffe0e0;
      border: 1px solid #cc7777;
      padding: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    .radio-input {
      width: auto;
      margin-right: 6px;
    }

    .purchase-button {
      font-weight: bold;
      padding: 8px 16px;
    }

    .footer {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
    }

    @media (max-width: 800px) {
      body {
        padding: 0;
      }

      .container {
        width: 100%;
        min-height: 100vh;
      }

      .header {
        flex-direction: column;
      }

      .header img {
        width: 100%;
        height: auto;
      }

      .nav-buttons {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .product,
      .cart-item {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="nav-buttons">
    <a href="verify.html"><button type="button">Verify Product</button></a>
    <a href="FAQ.html"><button type="button">Faq</button></a>
    <a href="info.html"><button type="button">Info</button></a>
  </div>

  <div class="header">
    <img src="company-image.jpg" alt="Company Image">
    <textarea rows="8" readonly>placeholder</textarea>
  </div>

  <hr>

  <h2>Whatever</h2>
  <div id="products">Loading products...</div>

  <hr>

  <h2>Cart</h2>
  <div class="cart-box">
    <div id="cart">Cart is empty</div>
    <p class="cart-total"><b>Total:</b> $<span id="total">0.00</span></p>
  </div>

  <hr>

  <h2>Checkout</h2>

  <div class="checkout-box">

    <div id="orderTypeSection" class="order-box">
      <p><b>Order Type</b></p>

      <label>
        <input class="radio-input" type="radio" name="orderType" value="pickup" checked>
        Pickup order
      </label>

      <div id="shippingOption"></div>
    </div>

    <div id="shippingDisabledText" class="disabled-shipping" style="display:none;">
      Shipping orders are not being recieved right now.
    </div>

    <div id="shippingFields" style="display:none;">
      <div id="shippingMessage" class="shipping-message"></div>
      <div id="paymentMessage" class="payment-message"></div>

      <input id="address" placeholder="Street address">
      <input id="state" placeholder="State">
      <input id="zip" placeholder="Zip code">
    </div>

    <input id="name" placeholder="Your name">
    <input id="email" placeholder="Your email">
    <input id="note" placeholder="Note (optional)">

    <button id="purchase" class="purchase-button">Purchase</button>

    <p id="status"></p>
  </div>

  <p class="footer">Powered by Furn</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
const PUBLIC_KEY = "dMY8Wq6ssR3M5I1go";
const SERVICE_ID = "service_zaglobv";

const OWNER_TEMPLATE_ID = "template_93vjopg";
const CUSTOMER_TEMPLATE_ID = "template_id6n2nd";

emailjs.init(PUBLIC_KEY);

let PRODUCTS = [];

let SETTINGS = {
  shippingEnabled: false,
  shippingMessage: "Shipping orders are handled after your order is received. You will be contacted by email with confirmation and details.",
  paymentInstructions: "For shipping orders, submit your order first. After your order is reviewed, you will receive confirmation and payment instructions by email."
};

const cart = [];

const productsDiv = document.getElementById("products");
const shippingOption = document.getElementById("shippingOption");
const shippingFields = document.getElementById("shippingFields");
const shippingMessage = document.getElementById("shippingMessage");
const paymentMessage = document.getElementById("paymentMessage");
const shippingDisabledText = document.getElementById("shippingDisabledText");

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function loadProducts() {
  try {
    const response = await fetch("products.json?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Could not load products.json");
    }

    const data = await response.json();

    if (Array.isArray(data)) {
      PRODUCTS = data;
    } else {
      SETTINGS = {
        ...SETTINGS,
        ...(data.settings || {})
      };

      PRODUCTS = data.products || [];
    }

    renderProducts();
    renderShippingOptions();

  } catch (err) {
    console.error(err);
    productsDiv.textContent = "Failed to load products.";
  }
}

function renderProducts() {
  productsDiv.innerHTML = "";

  const availableProducts = PRODUCTS.filter(p => p.inStock !== false);

  if (availableProducts.length === 0) {
    productsDiv.textContent = "No products available.";
    return;
  }

  availableProducts.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">$${Number(p.price).toFixed(2)}</div>
      </div>
      <button onclick="addToCart('${p.id}')">Add</button>
    `;

    productsDiv.appendChild(div);
  });
}

function renderShippingOptions() {
  shippingOption.innerHTML = "";

  if (SETTINGS.shippingEnabled === true) {
    shippingDisabledText.style.display = "none";

    shippingOption.innerHTML = `
      <label>
        <input class="radio-input" type="radio" name="orderType" value="shipping">
        Shipping order
      </label>
    `;

    shippingMessage.textContent = SETTINGS.shippingMessage;
    paymentMessage.textContent = SETTINGS.paymentInstructions;

  } else {
    shippingDisabledText.style.display = "block";
    shippingFields.style.display = "none";
  }

  const orderTypeInputs = document.querySelectorAll("input[name='orderType']");

  orderTypeInputs.forEach(input => {
    input.addEventListener("change", updateCheckoutFields);
  });

  updateCheckoutFields();
}

function getOrderType() {
  const selected = document.querySelector("input[name='orderType']:checked");
  return selected ? selected.value : "pickup";
}

function updateCheckoutFields() {
  const orderType = getOrderType();

  if (orderType === "shipping" && SETTINGS.shippingEnabled === true) {
    shippingFields.style.display = "block";
  } else {
    shippingFields.style.display = "none";
  }
}

function addToCart(id) {
  const product = PRODUCTS.find(p => p.id === id);

  if (!product) {
    return;
  }

  const item = cart.find(i => i.id === id);

  if (item) {
    item.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }

  renderCart();
}

function removeFromCart(id) {
  const index = cart.findIndex(i => i.id === id);

  if (index !== -1) {
    cart.splice(index, 1);
  }

  renderCart();
}

function renderCart() {
  const cartDiv = document.getElementById("cart");
  const totalSpan = document.getElementById("total");

  if (cart.length === 0) {
    cartDiv.textContent = "Cart is empty";
    totalSpan.textContent = "0.00";
    return;
  }

  let total = 0;
  cartDiv.innerHTML = "";

  cart.forEach(i => {
    const line = Number(i.price) * i.qty;
    total += line;

    cartDiv.innerHTML += `
      <div class="cart-item">
        <span>${i.qty}× ${i.name} — $${line.toFixed(2)}</span>
        <button onclick="removeFromCart('${i.id}')">Remove</button>
      </div>
    `;
  });

  totalSpan.textContent = total.toFixed(2);
}

document.getElementById("purchase").onclick = async () => {
  const status = document.getElementById("status");
  status.textContent = "";

  if (cart.length === 0) {
    status.textContent = "Cart is empty.";
    return;
  }

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const note = document.getElementById("note").value.trim();

  const orderType = getOrderType();

  const address = document.getElementById("address").value.trim();
  const state = document.getElementById("state").value.trim();
  const zip = document.getElementById("zip").value.trim();

  if (!name || !email) {
    status.textContent = "Name and email required.";
    return;
  }

  if (orderType === "shipping") {
    if (SETTINGS.shippingEnabled !== true) {
      status.textContent = "Shipping orders are not being recieved right now.";
      return;
    }

    if (!address || !state || !zip) {
      status.textContent = "Address, state, and zip code are required for shipping.";
      return;
    }
  }

  const orderItems = cart
    .map(i => `${i.qty}× ${i.name} ($${(Number(i.price) * i.qty).toFixed(2)})`)
    .join("\n");

  const total = cart
    .reduce((sum, item) => sum + Number(item.price) * item.qty, 0)
    .toFixed(2);

  const orderId = crypto.randomUUID().slice(0, 8).toUpperCase();

  const shippingAddress = orderType === "shipping"
    ? `${address}, ${state} ${zip}`
    : "N/A - Pickup order";

  const paymentInstructions = orderType === "shipping"
    ? SETTINGS.paymentInstructions
    : "N/A - Pickup order";

  const sharedParams = {
    order_id: orderId,
    customer_name: name,
    customer_email: email,
    order_items: orderItems,
    order_total: total,
    note: note || "(none)",

    order_type: orderType,
    shipping_address: shippingAddress,
    shipping_state: orderType === "shipping" ? state : "N/A",
    shipping_zip: orderType === "shipping" ? zip : "N/A",
    shipping_message: orderType === "shipping" ? SETTINGS.shippingMessage : "N/A",
    payment_instructions: paymentInstructions
  };

  try {
    status.textContent = "Sending order...";

    await emailjs.send(SERVICE_ID, OWNER_TEMPLATE_ID, sharedParams);

    await wait(1200);

    await emailjs.send(SERVICE_ID, CUSTOMER_TEMPLATE_ID, sharedParams);

    status.textContent = "Order sent successfully! A receipt was sent to your email.";

    cart.length = 0;
    renderCart();

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("note").value = "";
    document.getElementById("address").value = "";
    document.getElementById("state").value = "";
    document.getElementById("zip").value = "";

    document.querySelector("input[name='orderType'][value='pickup']").checked = true;
    updateCheckoutFields();

  } catch (err) {
    console.error(err);
    status.textContent = "Failed to send order.";
  }
};

loadProducts();
</script>

</body>
</html>
